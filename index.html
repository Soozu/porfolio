<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Soozu | Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div class="page-transition"></div>
    
    <div class="cursor"></div>
    <div class="cursor-follower"></div>
    <div id="canvas-container"></div>

    <div class="sidebar">
        <div class="nav-links">
            <a href="index.html" class="active">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="projects.html">
                <i class="fas fa-code"></i>
                <span>Projects</span>
            </a>
            <a href="skills.html">
                <i class="fas fa-tools"></i>
                <span>Skills</span>
            </a>
            <a href="contact.html">
                <i class="fas fa-envelope"></i>
                <span>Contact</span>
            </a>
        </div>
    </div>

    <div class="container">
        <header>
            <div class="logo">SOOZU</div>
            <div class="theme-switch-wrapper">
                <label class="theme-switch" for="checkbox">
                    <input type="checkbox" id="checkbox" />
                    <div class="slider"></div>
                </label>
            </div>
        </header>

        <section id="home" class="active">
            <div class="hero">
                <div class="hero-content">
                    <h1>Hi, I'm <span class="highlight">Christian</span></h1>
                    <h2>Full Stack Developer</h2>
                    <p>I build things for the web</p>
                    <div class="cta-buttons">
                        <a href="projects.html" class="btn primary">View My Work</a>
                        <a href="contact.html" class="btn secondary">Get In Touch</a>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Check if this is the first visit
            if (!sessionStorage.getItem('firstLoad')) {
                // Add animation classes
                document.body.classList.add('first-load');
                sessionStorage.setItem('firstLoad', 'true');
            } else {
                // Skip animations for subsequent visits
                document.body.classList.add('loaded');
                const elements = document.querySelectorAll('.hero-content, .logo, h1, h2, p, .cta-buttons, .sidebar');
                elements.forEach(el => el.style.opacity = '1');
            }
            
            // Remove transition overlay
            setTimeout(() => {
                const transition = document.querySelector('.page-transition');
                if (transition) {
                    transition.parentNode.removeChild(transition);
                }
            }, 1000);
        });
    </script>
    <script src="script.js"></script>
    <script src="background.js"></script>
    <script src="theme.js"></script>
</body>
</html>
