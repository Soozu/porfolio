<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Soozu | Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div class="page-transition"></div>
    
    <!-- Loading Animation -->
    <div class="loading-screen">
        <div class="loader">
            <div class="loader-content">
                <svg class="circular" viewBox="25 25 50 50">
                    <circle class="path" cx="50" cy="50" r="20" fill="none" stroke-width="3" stroke-miterlimit="10"/>
                </svg>
                <h2 class="loading-text">Loading<span class="dots">...</span></h2>
            </div>
        </div>
    </div>
    
    <div id="canvas-container"></div>

    <div class="sidebar">
        <div class="nav-links">
            <a href="index.html" class="active">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="projects.html">
                <i class="fas fa-code"></i>
                <span>Projects</span>
            </a>
            <a href="skills.html">
                <i class="fas fa-tools"></i>
                <span>Skills</span>
            </a>
            <a href="contact.html">
                <i class="fas fa-envelope"></i>
                <span>Contact</span>
            </a>
        </div>
    </div>

    <div class="container">
        <header>
            <div class="logo">SOOZU</div>
            <div class="theme-switch-wrapper">
                <label class="theme-switch" for="checkbox">
                    <input type="checkbox" id="checkbox" />
                    <div class="slider"></div>
                </label>
            </div>
        </header>

        <section id="home" class="active">
            <div class="hero">
                <div class="hero-content">
                    <h1>Hi, I'm <span class="highlight">Soozu</span></h1>
                    <h2>Full Stack Developer</h2>
                    <p>I build things for the web</p>
                    <div class="cta-buttons">
                        <a href="projects.html" class="btn primary">View My Work</a>
                        <a href="contact.html" class="btn secondary">Get In Touch</a>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loadingScreen = document.querySelector('.loading-screen');
            const hasVisited = localStorage.getItem('hasVisited');
            
            if (!hasVisited) {
                // First time visit - show loading animation
                loadingScreen.style.display = 'flex';
                setTimeout(() => {
                    loadingScreen.style.opacity = '0';
                    setTimeout(() => {
                        loadingScreen.style.display = 'none';
                        // Set first visit flag
                        localStorage.setItem('hasVisited', 'true');
                        
                        // First visit animations
                        document.body.classList.add('first-load');
                        sessionStorage.setItem('firstLoad', 'true');
                        
                        // Remove transition overlay
                        setTimeout(() => {
                            const transition = document.querySelector('.page-transition');
                            if (transition) {
                                transition.parentNode.removeChild(transition);
                            }
                        }, 1000);
                    }, 300);
                }, 2000);
            } else {
                // Returning visitor - skip loading animation
                loadingScreen.style.display = 'none';
                document.body.classList.add('loaded');
                const elements = document.querySelectorAll('.hero-content, .logo, h1, h2, p, .cta-buttons, .sidebar');
                elements.forEach(el => el.style.opacity = '1');
                
                // Remove transition overlay immediately
                const transition = document.querySelector('.page-transition');
                if (transition) {
                    transition.parentNode.removeChild(transition);
                }
            }
        });
    </script>
    <script src="script.js"></script>
    <script src="background.js"></script>
    <script src="theme.js"></script>
</body>
</html>
