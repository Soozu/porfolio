<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Soozu | Skills</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="skills.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div class="cursor"></div>
    <div class="cursor-follower"></div>
    <div id="canvas-container"></div>

    <div class="sidebar">
        <div class="nav-links">
            <a href="index.html">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="projects.html">
                <i class="fas fa-code"></i>
                <span>Projects</span>
            </a>
            <a href="skills.html" class="active">
                <i class="fas fa-tools"></i>
                <span>Skills</span>
            </a>
            <a href="contact.html">
                <i class="fas fa-envelope"></i>
                <span>Contact</span>
            </a>
        </div>
    </div>

    <div class="container">
        <header>
            <div class="logo">SOOZU</div>
        </header>

        <section id="skills" class="active">
            <h2>Skills & Technologies</h2>
            <div class="skills-container">
                <div class="skills-categories">
                    <div class="category">
                        <h3>Frontend Development</h3>
                        <div class="skills-box">
                            <div class="skill-item">
                                <img src="icons/html5.svg" alt="HTML5">
                                <span>HTML5</span>
                                <div class="skill-line"></div>
                            </div>
                            <div class="skill-item">
                                <img src="icons/css3.svg" alt="CSS3">
                                <span>CSS3</span>
                                <div class="skill-line"></div>
                            </div>
                            <div class="skill-item">
                                <img src="icons/javascript.svg" alt="JavaScript">
                                <span>JavaScript</span>
                                <div class="skill-line"></div>
                            </div>
                        </div>
                    </div>

                    <div class="category">
                        <h3>Backend Development</h3>
                        <div class="skills-box">
                            <div class="skill-item">
                                <img src="icons/nodejs.svg" alt="Node.js">
                                <span>Node.js</span>
                                <div class="skill-line"></div>
                            </div>
                            <div class="skill-item">
                                <img src="icons/php.svg" alt="PHP">
                                <span>PHP</span>
                                <div class="skill-line"></div>
                            </div>
                            <div class="skill-item">
                                <img src="icons/mysql.svg" alt="MySQL">
                                <span>MySQL</span>
                                <div class="skill-line"></div>
                            </div>
                        </div>
                    </div>

                    <div class="category">
                        <h3>Tools & Others</h3>
                        <div class="skills-box">
                            <div class="skill-item">
                                <img src="icons/git.svg" alt="Git">
                                <span>Git</span>
                                <div class="skill-line"></div>
                            </div>
                            <div class="skill-item">
                                <img src="icons/docker.svg" alt="Docker">
                                <span>Docker</span>
                                <div class="skill-line"></div>
                            </div>
                            <div class="skill-item">
                                <img src="icons/aws.svg" alt="AWS">
                                <span>AWS</span>
                                <div class="skill-line"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
    <script src="background.js"></script>
</body>
</html>
